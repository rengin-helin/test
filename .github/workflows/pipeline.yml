name: Bruno API Tests

on:
  push:
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Bruno tests
        run: |
          docker run --rm \
          -v "${{ github.workspace }}:/bruno" \
          -w /bruno/automationexercise.com \
          usebruno/cli:3.4.2 run \
          --reporter-junit /bruno/automationexercise.com/results.xml

      - name: Publish test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Bruno Test Results
          path: automationexercise.com/results.xml
          reporter: java-junit