info:
  name: Search Product without a keyword
  type: http
  seq: 3

http:
  method: POST
  url: https://automationexercise.com/api/searchProduct
  body:
    type: multipart-form
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const data = res.getBody();

        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
         
        test("Products lists not returned with 400", function () {
          expect(data).to.be.an("object");
          expect(data.responseCode).to.equal(400);
          expect(data.message).to.equal("Bad request, search_product parameter is missing in POST request.");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
