info:
  name: Get User Details with non-existent user
  type: http
  seq: 5

http:
  method: GET
  url: https://automationexercise.com/api/getUserDetailByEmail?email=mailmailmailmail@mail.com
  params:
    - name: email
      value: mailmailmailmail@mail.com
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const data = res.getBody();

        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
         
        test("No user returned with 404", function () {
          expect(data).to.be.an("object");
          expect(data.responseCode).to.equal(404);
          expect(data.message).to.equal("Account not found with this email, try another email!");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
