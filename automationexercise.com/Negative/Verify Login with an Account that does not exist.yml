info:
  name: Verify Login with an Account that does not exist
  type: http
  seq: 2

http:
  method: POST
  url: https://automationexercise.com/api/verifyLogin
  body:
    type: multipart-form
    data:
      - name: email
        type: text
        value: email@email.com
      - name: password
        type: text
        value: "12345"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
         
        test("Account is not verified with responseCode 404", function () {
          const data = res.getBody();
          expect(data).to.be.an("object");
          expect(data.responseCode).to.equal(404);
          expect(data.message).to.equal("User not found!");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
